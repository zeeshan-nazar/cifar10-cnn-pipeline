stages:

  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw/train.pt
      - data/raw/test.pt

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - params.yaml
      - data/raw/train.pt
      - data/raw/test.pt
    outs:
      - data/processed/train.pt
      - data/processed/val.pt
      - data/processed/test.pt

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - params.yaml
      - data/processed/train.pt
      - data/processed/val.pt
    outs:
      - models/model.pth
      - models/history.csv

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - params.yaml
      - data/processed/test.pt
      - models/model.pth
    outs:
      - confusion_matrix.png
    metrics:
      - metrics.json